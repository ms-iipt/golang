name: xupdate

# 공식 Go 소스에서 std/cmd 가 포함한 golang.org/x/net, x/text, x/sys 를 최신으로 올린 linux/amd64
# 배포본을 버전별로 빌드·테스트해 해당 Release(go<버전>)와 저장소의 archives/ 에 추가한다.
# release 워크플로가 끝에 호출하고, 이미 있는 Release 를 다시 만들 때는 직접 실행한다.
# 다시 실행하면 같은 이름의 파일과 릴리스 노트의 해당 섹션을 교체한다.
#   - Actions 탭 > xupdate > Run workflow (여러 버전은 공백/쉼표로 구분, 예: 1.26.8 1.27.2)
on:
  workflow_dispatch:
    inputs:
      versions:
        description: Go 버전 (여러 개는 공백/쉼표로 구분, 예 1.26.8 1.27.2. 해당 Release가 있어야 함)
        required: true
        default: 1.27.2
  workflow_call:
    inputs:
      versions:
        description: Go 버전 (공백/쉼표 구분 또는 JSON 배열)
        type: string
        required: true

permissions:
  contents: write

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.parse.outputs.list }}
    steps:
      - id: parse
        env:
          INPUT: ${{ inputs.versions }}
        run: |
          list="$(jq -cn --arg v "$INPUT" '[$v | splits("[\\s,\\[\\]\"]+") | select(. != "") | ltrimstr("go")]')"
          echo "$list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  build:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.list) }}
    env:
      VERSION: ${{ matrix.version }}
      FILE: go${{ matrix.version }}.linux-amd64.xupdate.tar.gz
    steps:
      - uses: actions/checkout@v7

      # 부트스트랩용 Go
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.version }}
          cache: false

      - name: Build
        run: WORK_DIR="$RUNNER_TEMP/work" scripts/build-xupdate.sh "$VERSION"

      - name: Test
        shell: bash # -eo pipefail
        run: |
          # 결과물을 풀어 그 go 로 테스트한다.
          tar -C "$RUNNER_TEMP" -xzf "dist/$FILE"
          export PATH="$RUNNER_TEMP/go/bin:$PATH" GOTOOLCHAIN=local
          unset GOROOT

          got="$(go version)"
          echo "$got"
          test "$got" = "go version go$VERSION linux/amd64"

          # 실패한 패키지는 한 번 더 돌려 다시 실패할 때만 멈춘다. 공식 빌드에서도 가끔 실패하는
          # 테스트가 있다 (예: cmd/cgo/internal/testsanitizers 의 ASan 런타임 오류, golang/go#78770).
          log="$RUNNER_TEMP/test.log"
          if ! go test -short std cmd/... 2>&1 | tee "$log"; then
            mapfile -t failed < <(awk '$1 == "FAIL" && NF > 1 { print $2 }' "$log" | sort -u)
            if [[ ${#failed[@]} -eq 0 ]]; then
              exit 1
            fi
            echo "::warning::retrying failed packages: ${failed[*]}"
            go test -short -count=1 "${failed[@]}"
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="go$VERSION"
          SHA256="$(cut -d' ' -f1 "dist/$FILE.sha256")"
          DOWNLOAD_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$FILE"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          TABLE="$(cat "dist/go$VERSION.linux-amd64.xupdate.md")"
          export VERSION FILE SHA256 DOWNLOAD_URL RUN_URL TABLE

          gh release upload "$TAG" "dist/$FILE" "dist/$FILE.sha256" --clobber

          # 릴리스 노트에서 이전 xupdate 섹션(과 끝의 빈 줄)을 지우고 새 섹션을 붙인다.
          notes="$RUNNER_TEMP/notes.md"
          gh release view "$TAG" --json body --jq .body |
            sed '/^<!-- xupdate -->/,/^<!-- \/xupdate -->/d' |
            awk '{ l[NR] = $0 } END { n = NR; while (n > 0 && l[n] ~ /^[[:space:]]*$/) n--; for (i = 1; i <= n; i++) print l[i] }' > "$notes"
          echo >> "$notes"
          # shellcheck disable=SC2016 # envsubst 에 치환할 변수 이름을 그대로 넘긴다
          envsubst '${VERSION} ${FILE} ${SHA256} ${DOWNLOAD_URL} ${RUN_URL} ${TABLE}' \
            < .github/release-notes-xupdate.md >> "$notes"
          gh release edit "$TAG" --notes-file "$notes"

      - uses: actions/upload-artifact@v7
        with:
          name: xupdate-${{ matrix.version }}
          path: |
            dist/${{ env.FILE }}
            dist/${{ env.FILE }}.sha256
          compression-level: 0
          retention-days: 1

  # 버전별 job 이 동시에 push 하지 않도록 결과를 모아 한 번에 커밋한다.
  archive:
    needs: build
    if: ${{ !cancelled() }} # 일부 버전이 실패해도 성공한 버전은 커밋한다
    runs-on: ubuntu-latest
    concurrency:
      group: archives
    env:
      BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BRANCH }}

      - uses: actions/download-artifact@v8
        with:
          pattern: xupdate-*
          path: archives
          merge-multiple: true

      - name: Commit to archives/
        run: |
          # Release 와 같은 파일을 저장소에도 둔다. 내용이 같으면(재현 빌드) 커밋하지 않는다.
          git add archives
          if git diff --cached --quiet; then
            echo "archives/ is unchanged"
            exit 0
          fi
          files="$(git diff --cached --name-only -- 'archives/*.tar.gz' | xargs -n 1 basename | paste -sd ' ' -)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "archives: update $files"
          git push origin "HEAD:$BRANCH"
